plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.mp3retrowidget'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.mp3retrowidget"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // No AndroidX / no third party libs on purpose: the widget only needs
    // framework APIs (RemoteViews, MediaSessionManager, NotificationListener).
}
